<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result</title>
</head>
<body>
    <table border="1">
        <thead>
            <caption>Student Result</caption>
            <colgroup>
            <col span="7span" style="background-color: aqua;">
        </colgroup>
            <tr>
                <th>Reg.No</th>
                <th>Name</th>
                <th>Sub.Name</th>
                <th>Sub.Code</th>
                <th>Mark</th>
                <th>Grade</th>
                <th>Pass/Fail</th>
        
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1011</td>
                <td>Premkumar</td>
                <td>Tamil</td>
                <td>23TA012</td>
                <td>80</td>
                <td>A</td>
                <td style="background-color: green;">Pass</td>
            </tr>
            <tr>
                <td>1012</td>
                <td>Raja</td>
                <td>Tamil</td>
                <td>23TA012</td>
                <td>78</td>
                <td>B</td>
                <td style="background-color: green;">Pass</td>
            </tr>
            <tr>
                <td>1013</td>
                <td>Sathish</td>
                <td>Tamil</td>
                <td>23TA012</td>
                <td>27</td>
                <td>D</td>
                <td style="background-color: red;">Fail</td>
            </tr>
            <td colspan="4 span" style="text-align: right;">Total Score</td>
            <td colspan="3 span" style="background-color: greenyellow;">185</td>
        </tbody>
        <tfoot>
            <tr style="text-align: center;">
                <td colspan="7 span" style="background-color: orange;">&copy;2022</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
